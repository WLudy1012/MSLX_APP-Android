# CNB（cnb.cool）云构建配置：main push 构建 debug APK；v* tag 推送时构建签名 release APK 并发布 CNB Release。
# 签名密钥通过 imports 注入（密钥仓库 keystore.yml：KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD），
# 未配置时 tag 流水线直接失败（不发布未签名包，应用端会自动回退 GitHub 下载）。

main:
  push:
    - docker:
        image: mobiledevops/android-sdk-image:34.0.1
        volumes:
          - /root/.gradle:cow
      stages:
        - name: verify embedded jre runtime
          script: |
            set -eu
            JRE=app/src/main/assets/jre/jre17-arm64-20210825-release.tar.xz
            SHA=c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d
            [ -f "$JRE" ] || { echo "ERROR: 缺少内嵌 JRE 归档 $JRE" >&2; exit 1; }
            echo "$SHA  $JRE" | sha256sum -c -
        - name: build debug apk
          script: |
            set -eu
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
        - name: list debug apk
          script: ls -lh app/build/outputs/apk/debug

$:
  tag_push:
    - docker:
        image: mobiledevops/android-sdk-image:34.0.1
        volumes:
          - /root/.gradle:cow
      imports:
        # 私有密钥仓库文件（用户自建，勿公开）：内含 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        https://cnb.cool/WLudy/MSLX-secrets/-/blob/main/keystore.yml
      stages:
        - name: restore signing keystore
          script: |
            set -eu
            if [ -z "${KEYSTORE_BASE64:-}" ]; then
              echo "ERROR: KEYSTORE_BASE64 未配置（请在私有密钥仓库 MSLX-secrets 提供 keystore.yml）" >&2
              exit 1
            fi
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > keystore/release.jks
            cat > keystore.properties <<EOF
            storeFile=keystore/release.jks
            storePassword=${KEYSTORE_PASSWORD}
            keyAlias=${KEY_ALIAS}
            keyPassword=${KEY_PASSWORD}
            EOF

        - name: verify embedded jre runtime
          script: |
            set -eu
            JRE=app/src/jreRuntime/assets/jre/jre17-arm64-20210825-release.tar.xz
            SHA=c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d
            [ -f "$JRE" ] || { echo "ERROR: 缺少内嵌 JRE 归档 $JRE" >&2; exit 1; }
            echo "$SHA  $JRE" | sha256sum -c -

        # 同一 Release 发布两个变体：app-release.apk（完整版，内嵌 JRE）与
        # app-release-lite.apk（精简版，不含 JRE）；JRE 归档本身也作为附件，
        # 供精简版在应用内下载（客户端按 CNB → GitHub 顺序尝试）。
        - name: build signed release apk (full, embedded jre)
          script: |
            set -eu
            [ -f keystore.properties ] || { echo "ERROR: 签名配置缺失，禁止发布未签名包" >&2; exit 1; }
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ./app-release.apk

        - name: build signed release apk (lite, no jre)
          script: |
            set -eu
            ./gradlew assembleRelease -PwithoutJre=true --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ./app-release-lite.apk
            ls -lh app-release.apk app-release-lite.apk
            unzip -l app-release.apk | grep -q 'assets/jre/' || { echo "ERROR: 完整版缺少内嵌 JRE" >&2; exit 1; }
            if unzip -l app-release-lite.apk | grep -q 'assets/jre/'; then
              echo "ERROR: 精简版不应包含内嵌 JRE" >&2; exit 1
            fi

        - name: prepare release notes
          script: |
            set -eu
            CUR_TAG=$(git describe --tags --exact-match 2>/dev/null || true)
            git fetch --tags --force --quiet 2>/dev/null || true
            IS_BETA=$(echo "$CUR_TAG" | grep -qiE -- '-beta$' && echo 1 || echo 0)
            if [ "$IS_BETA" = "1" ]; then
              # Beta：上一版 = 最近一个 Beta tag；没有则回退到最近一个正式 tag
              PREV_TAG=$(git tag --list 'v*' | grep -iE -- '-beta$' | grep -v "^${CUR_TAG}$" | sort -V | tail -1 || true)
              if [ -z "$PREV_TAG" ]; then
                PREV_TAG=$(git tag --list 'v*' | grep -ivE -- '-beta$' | grep -v "^${CUR_TAG}$" | sort -V | tail -1 || true)
              fi
            else
              PREV_TAG=$(git tag --list 'v*' | grep -ivE -- '-beta$' | grep -v "^${CUR_TAG}$" | sort -V | tail -1 || true)
            fi
            echo "当前 tag=$CUR_TAG 上一版本=${PREV_TAG:-<无>} tag 总数=$(git tag --list 'v*' | wc -l)"
            {
              echo "# MSLX_APP-Android $CUR_TAG"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                echo "自 \`$PREV_TAG\` 以来的提交："
                echo ""
                git log --no-merges --pretty=format:"- %s" "${PREV_TAG}..${CUR_TAG}"
              else
                # 绝不回退成"列出全部历史提交"
                echo "> 未能确定上一版本 tag（首个版本或 tag 未同步），仅列出最近 15 条提交。"
                echo ""
                git log -n 15 --no-merges --pretty=format:"- %s" "${CUR_TAG}"
              fi
              echo ""
              echo ""
              echo "> 上一版本：\`${PREV_TAG:-无}\`"
              echo "## 两个变体（按需选择）"
              echo ""
              echo "| 包 | 说明 | 大小 | SHA-256 |"
              echo "| --- | --- | --- | --- |"
              echo "| \`app-release.apk\` | **完整版**：内嵌 Android JRE 运行时，本机开服可离线使用 | $(du -m app-release.apk | awk '{print $1}') MB | \`$(sha256sum app-release.apk | awk '{print $1}')\` |"
              echo "| \`app-release-lite.apk\` | **精简版**：不含运行时，体积小；本机开服首次使用需联网下载约 36MB 运行时 | $(du -m app-release-lite.apk | awk '{print $1}') MB | \`$(sha256sum app-release-lite.apk | awk '{print $1}')\` |"
              echo ""
              echo "两个包版本号与签名一致，可互相覆盖安装（切换变体无需卸载）。"
            } > CNB_RELEASE.md

        - name: create cnb release
          type: git:release
          options:
            descriptionFromFile: CNB_RELEASE.md
            latest: true

        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - app-release.apk
              - app-release-lite.apk
              - app/src/jreRuntime/assets/jre/jre17-arm64-20210825-release.tar.xz
