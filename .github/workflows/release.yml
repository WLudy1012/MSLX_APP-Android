name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & attach signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整克隆以获取历史提交与 tag（生成 release notes 需要）
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 本机开服把 Android JRE 内嵌进 APK：仓库内归档必须存在且哈希正确，
      # 否则发布出去的包会退化成"首次开服需联网下载运行时"。
      - name: Verify embedded JRE runtime
        run: |
          set -e
          JRE=app/src/jreRuntime/assets/jre/jre17-arm64-20210825-release.tar.xz
          SHA=c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d
          if [ ! -f "$JRE" ]; then
            echo "::error::缺少内嵌 JRE 归档 $JRE（本机开服的运行时）"
            exit 1
          fi
          echo "$SHA  $JRE" | sha256sum -c -
          ls -lh "$JRE"

      # 从仓库 Secrets 恢复签名密钥并生成 keystore.properties。
      # 需在仓库 Settings → Secrets and variables → Actions 配置：
      #   KEYSTORE_BASE64   = base64 编码后的 .jks 文件内容
      #   KEYSTORE_PASSWORD = 密钥库密码
      #   KEY_ALIAS         = 密钥别名
      #   KEY_PASSWORD      = 密钥密码
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is empty. 请在仓库 Settings → Secrets and variables → Actions 配置该 Secret（值见本地 ACTIONS_GUIDE.md）。"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 不能为空。"
            exit 1
          fi
          mkdir -p keystore
          # 校验 base64 值是否合法（必须是单行、无空格/换行/表格符号的纯 base64）
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > keystore/release.jks || {
            echo "::error::KEYSTORE_BASE64 解码失败。请从 ACTIONS_GUIDE.md 的代码块中整行复制纯 base64 值（不要带空格或 | 符号），重新配置该 Secret。"
            exit 1
          }
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # 同一 Release 发布两个变体：
      #   app-release.apk      完整版（内嵌 JRE 运行时，可离线开服）
      #   app-release-lite.apk 精简版（不含运行时，体积小；本机开服首次使用需联网下载运行时）
      # 并把 JRE 归档本身作为资产挂上，供精简版在应用内下载（客户端按 CNB → GitHub 顺序尝试）。
      - name: Build signed release APK (full, embedded JRE)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ./app-release.apk

      - name: Build signed release APK (lite, no JRE)
        run: |
          ./gradlew assembleRelease -PwithoutJre=true --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ./app-release-lite.apk
          ls -lh app-release.apk app-release-lite.apk
          # 自检：完整版必须含内嵌 JRE，精简版必须不含
          unzip -l app-release.apk | grep -q 'assets/jre/' || { echo "::error::完整版缺少内嵌 JRE"; exit 1; }
          if unzip -l app-release-lite.apk | grep -q 'assets/jre/'; then
            echo "::error::精简版不应包含内嵌 JRE"
            exit 1
          fi

      # 生成 release notes：取"上一版"并列出其到本版的全部提交。
      # 层级规则（正式版 x.x / Beta x.x.x / Actions x.x.x.x）：
      #   - 正式版/强制版：上一版 = 最近一个不带 -Beta 后缀的 v* tag（跳过中间所有 Beta，保证
      #     release note 包含"直至上一正式版的全部 Beta 更新"）；
      #   - Beta 版：上一版 = 最近一个带 -Beta 后缀的 v* tag（包含中间 Actions 更新）；若无，
      #     回退到最近一个不带 -Beta 的 tag。
      - name: Generate release notes
        run: |
          CUR_TAG="${{ github.ref_name }}"
          IS_BETA=$(echo "$CUR_TAG" | grep -qiE -- '-beta$' && echo 1 || echo 0)
          if [ "$IS_BETA" = "1" ]; then
            PREV_TAG=$(git tag --list 'v*' | grep -iE -- '-beta$' | grep -v "^$CUR_TAG$" | sort -V | tail -1)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(git tag --list 'v*' | grep -ivE -- '-beta$' | grep -v "^$CUR_TAG$" | sort -V | tail -1)
            fi
          else
            PREV_TAG=$(git tag --list 'v*' | grep -ivE -- '-beta$' | grep -v "^$CUR_TAG$" | sort -V | tail -1)
          fi
          {
            echo "# MSLX_APP-Android $CUR_TAG"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "自 $PREV_TAG 以来的提交："
              echo ""
              git log --pretty=format:"- %s" "$PREV_TAG..HEAD"
            else
              echo "提交："
              echo ""
              git log --pretty=format:"- %s"
            fi
            echo ""
          } > release_notes.md

      # 计算两个变体的 SHA256 并写入 release notes，供用户校验文件完整性
      - name: Compute APK SHA256
        run: |
          FULL_SHA=$(sha256sum app-release.apk | awk '{print $1}')
          LITE_SHA=$(sha256sum app-release-lite.apk | awk '{print $1}')
          FULL_MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s app-release.apk)/1048576}")
          LITE_MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s app-release-lite.apk)/1048576}")
          {
            echo ""
            echo "## 两个变体（按需选择）"
            echo ""
            echo "| 包 | 说明 | 大小 | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            echo "| \`app-release.apk\` | **完整版**：内嵌 Android JRE 运行时，本机开服可离线使用 | ${FULL_MB} MB | \`$FULL_SHA\` |"
            echo "| \`app-release-lite.apk\` | **精简版**：不含运行时，体积小；本机开服首次使用需联网下载约 36MB 运行时 | ${LITE_MB} MB | \`$LITE_SHA\` |"
            echo ""
            echo "两个包版本号与签名一致，可互相覆盖安装（切换变体无需卸载）。"
            echo ""
            echo "校验命令（Windows PowerShell）："
            echo "\`\`\`powershell"
            echo "Get-FileHash app-release.apk -Algorithm SHA256"
            echo "Get-FileHash app-release-lite.apk -Algorithm SHA256"
            echo "\`\`\`"
          } >> release_notes.md

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            app-release-lite.apk
            app/src/jreRuntime/assets/jre/jre17-arm64-20210825-release.tar.xz
          body_path: release_notes.md
