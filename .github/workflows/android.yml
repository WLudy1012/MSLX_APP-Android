name: Android 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: 构建 Android 应用
    runs-on: ubuntu-latest
    env:
      # ubuntu runner 自带 SDK 的固定路径；缓存 NDK 等组件时需要以 env 形式引用
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      MSLX_MAVEN_GOOGLE_MIRROR: https://maven.aliyun.com/repository/google
      MSLX_MAVEN_CENTRAL_MIRROR: https://maven.aliyun.com/repository/public
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 完整历史用于构建诊断与版本信息
          fetch-depth: 0
          # 显式获取 tag，便于构建记录
          fetch-tags: true

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 只缓存 NDK（约 1GB）；runner 预装的 platform/build-tools 权限不适合通过 tar 恢复。
      # 缓存 miss 时 sdkmanager 会安装 NDK，job 结束后再由此 step 回写缓存。
      # 注意：Gradle 依赖缓存（~/.gradle）由下面的 gradle/actions/setup-gradle 负责
      #（其内部就是基于 actions/cache 的官方实现），这里不要重复缓存 ~/.gradle，
      # 否则两套缓存系统还原到同一目录会互相覆盖。
      - name: 缓存 Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          key: android-ndk-28.2.13676358-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            android-ndk-28.2.13676358-${{ runner.os }}-

      # 不用 android-actions/setup-android@v3：它在末尾会执行 `sdkmanager tools`，而 Google
      # 已把 `tools` 包从仓库下架（Warning: Failed to find package 'tools' → exit 1），
      # runner 镜像换成 cmdline-tools 16.0 后这一步必然失败（v1.6.6-Beta 起 Release/CI 全挂）。
      # ubuntu 运行器自带 Android SDK（ANDROID_HOME）且许可已在镜像内接受，AGP 会按需补齐
      # 缺失的 platform / build-tools，所以下面只做容错预热，任何失败都不阻断构建。
      - name: 配置 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMAN=""
          for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKMAN="$c"; break; fi
          done
          if [ -z "$SDKMAN" ]; then
            echo "::warning::未找到 sdkmanager，直接使用镜像预装 SDK"
            exit 0
          fi
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" platform-tools \
            || echo "::warning::sdkmanager 预装未完全成功，交由 AGP 自动下载"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      # 依赖缓存健康检查（非阻断）：缓存完整时依赖解析可零网络通过
      #（即 install 阶段无需联网）；首次构建或依赖有更新时失败，仅提示正式构建会联网补齐。
      - name: 验证依赖缓存（离线试运行）
        run: |
          chmod +x gradlew
          if ./gradlew :app:dependencies --offline -q > /dev/null 2>&1; then
            echo "依赖缓存完整：offline 解析通过（install 阶段可零网络完成）"
          else
            echo "::warning::offline 解析未完全通过（首次构建或依赖已更新），正式构建将联网补齐"
          fi

      # 本机开服需要内嵌 JRE：归档缺失会让 dev 构建的调试包装不上运行时
      - name: 验证内嵌 JRE 运行时
        run: |
          set -e
          JRE=app/src/jreRuntime/assets/jre/jre17-arm64-20210825-release.tar.xz
          SHA=c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d
          if [ ! -f "$JRE" ]; then
            echo "::error::缺少内嵌 JRE 归档 $JRE（本机开服的运行时）"
            exit 1
          fi
          echo "$SHA  $JRE" | sha256sum -c -

      # 仅 main push 时恢复正式签名密钥；PR 使用默认 debug 签名。
      - name: 恢复签名密钥（仅 main）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 为空，本次 debug 将使用默认 debug 签名（不可覆盖安装正式版）。"
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::签名密钥已配置，但 KEYSTORE_PASSWORD 或 KEY_PASSWORD 为空。"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > keystore/release.jks || {
            echo "::error::KEYSTORE_BASE64 解码失败，请更新为 Rolithax release JKS。"
            exit 1
          }
          keytool -list -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias wludy > /dev/null 2>&1 || {
            echo "::error::签名密钥无效或缺少 wludy 别名，请更新 GitHub 签名 Secrets。"
            exit 1
          }
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=wludy
          keyPassword=$KEY_PASSWORD
          EOF

      # 无 keystore 时 release 会产出未签名包，仅用于验证可编译性
      - name: 构建 Debug 与 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 同步 main 源码到 CNB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::warning::未配置 CNB_TOKEN，跳过 CNB main 源码同步。"
            exit 0
          fi
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/WLudy/MSLX_APP-Android.git"
          git fetch cnb refs/heads/main:refs/remotes/cnb/main --quiet
          git merge --no-edit --no-ff refs/remotes/cnb/main
          git push cnb "HEAD:refs/heads/main"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
