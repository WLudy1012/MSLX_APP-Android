name: Android 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: 构建 Android 应用
    runs-on: ubuntu-latest
    env:
      # ubuntu runner 自带 SDK 的固定路径；缓存 NDK 等组件时需要以 env 形式引用
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      MSLX_MAVEN_GOOGLE_MIRROR: https://maven.aliyun.com/repository/google
      MSLX_MAVEN_CENTRAL_MIRROR: https://maven.aliyun.com/repository/public
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 生成 dev 构建说明与 Actions 版本号时需要 tag 与提交信息
          fetch-depth: 0
          # 必须显式取 tag：git describe --tags 依赖它算 Actions 四段版本号
          fetch-tags: true

      - name: 同步 main 源码到 CNB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::warning::未配置 CNB_TOKEN，跳过 CNB main 源码同步。"
            exit 0
          fi
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/WLudy/MSLX_APP-Android.git"
          # CNB 可能保留了上一次镜像生成的不同提交对象，普通 push 会被非快进保护拒绝。
          # 先读取远端期望值，再强制对齐 GitHub main；若期间发生新的 CNB 改动，lease 会保护它。
          git fetch cnb refs/heads/main:refs/remotes/cnb/main --quiet
          CNB_MAIN=$(git rev-parse refs/remotes/cnb/main)
          git push cnb "HEAD:refs/heads/main" --force-with-lease="refs/heads/main:${CNB_MAIN}"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK 组件缓存：NDK（约 1GB）是最大耗时项，当前每次全新构建都要下载。
      # 缓存 miss 时 AGP 会自动下载并在 job 结束时由本 step 回写缓存。
      # 注意：Gradle 依赖缓存（~/.gradle）由下面的 gradle/actions/setup-gradle 负责
      #（其内部就是基于 actions/cache 的官方实现），这里不要重复缓存 ~/.gradle，
      # 否则两套缓存系统还原到同一目录会互相覆盖。
      - name: 缓存 Android SDK（NDK / 平台 / 构建工具）
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-35
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0
          # key 写入组件版本：升级 NDK/SDK 时 key 自然失效，缓存随之重建
          key: android-sdk-35-ndk-28.2.13676358-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            android-sdk-35-ndk-28.2.13676358-${{ runner.os }}-

      # 不用 android-actions/setup-android@v3：它在末尾会执行 `sdkmanager tools`，而 Google
      # 已把 `tools` 包从仓库下架（Warning: Failed to find package 'tools' → exit 1），
      # runner 镜像换成 cmdline-tools 16.0 后这一步必然失败（v1.6.6-Beta 起 Release/CI 全挂）。
      # ubuntu 运行器自带 Android SDK（ANDROID_HOME）且许可已在镜像内接受，AGP 会按需补齐
      # 缺失的 platform / build-tools，所以下面只做容错预热，任何失败都不阻断构建。
      - name: 配置 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMAN=""
          for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKMAN="$c"; break; fi
          done
          if [ -z "$SDKMAN" ]; then
            echo "::warning::未找到 sdkmanager，直接使用镜像预装 SDK"
            exit 0
          fi
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" platform-tools \
            || echo "::warning::sdkmanager 预装未完全成功，交由 AGP 自动下载"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 依赖缓存健康检查（非阻断）：缓存完整时依赖解析可零网络通过
      #（即 install 阶段无需联网）；首次构建或依赖有更新时失败，仅提示正式构建会联网补齐。
      - name: 验证依赖缓存（离线试运行）
        run: |
          chmod +x gradlew
          if ./gradlew :app:dependencies --offline -q > /dev/null 2>&1; then
            echo "依赖缓存完整：offline 解析通过（install 阶段可零网络完成）"
          else
            echo "::warning::offline 解析未完全通过（首次构建或依赖已更新），正式构建将联网补齐"
          fi

      # 本机开服需要内嵌 JRE：归档缺失会让 dev 构建的调试包装不上运行时
      - name: 验证内嵌 JRE 运行时
        run: |
          set -e
          JRE=app/src/jreRuntime/assets/jre/jre17-arm64-20210825-release.tar.xz
          SHA=c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d
          if [ ! -f "$JRE" ]; then
            echo "::error::缺少内嵌 JRE 归档 $JRE（本机开服的运行时）"
            exit 1
          fi
          echo "$SHA  $JRE" | sha256sum -c -

      # 仅 main push 时恢复正式签名密钥：debug 构建用 release 签名，
      # 产出的 Actions 调试 APK 可直接覆盖安装正式版（PR 无 Secrets，走默认 debug 签名）。
      - name: 恢复签名密钥（仅 main）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 为空，本次 debug 将使用默认 debug 签名（不可覆盖安装正式版）。"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Actions 版本号规则（x.x.x.x，四段）：
      #   取最近一个 v* tag（去掉 v 与 -Beta/-Force 后缀）作为基准并补齐到三段，
      #   再追加 .$GITHUB_RUN_NUMBER 作为第四段（本仓库累计运行号）。
      #   示例：稳定 v1.15 → 1.15.0.12；beta v1.15.1 → 1.15.1.12。
      - name: 计算 Actions 版本号（仅 main）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          BASE="1.2.16"
          if [ -n "$LATEST_TAG" ]; then
            CLEAN=$(echo "$LATEST_TAG" | sed -E 's/^v//; s/-(Beta|Force)$//I')
            case "$CLEAN" in
              [0-9]*.[0-9]*.[0-9]*.[0-9]*) BASE="$CLEAN" ;;   # 4+ 段：直接使用
              [0-9]*.[0-9]*.[0-9]*)        BASE="$CLEAN" ;;   # 3 段（beta）：直接使用
              [0-9]*.[0-9]*)               BASE="$CLEAN.0" ;; # 2 段（稳定）：补第三段 0
              *)                           BASE="1.2.16" ;;
            esac
          fi
          echo "ACTIONS_VERSION=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ACTIONS_VERSION=${BASE}.${GITHUB_RUN_NUMBER}"

      # 无 keystore 时 release 会产出未签名包，仅用于验证可编译性
      - name: 构建 Debug 与 Release APK
        run: |
          chmod +x gradlew
          if [ -n "$ACTIONS_VERSION" ]; then
            ./gradlew assembleDebug assembleRelease -PversionName="$ACTIONS_VERSION" --no-daemon --stacktrace
          else
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Actions 更新渠道的数据源：把 main 分支最新 debug APK 发布到 dev Release（覆盖更新）。
      # 注：GitHub Actions 工件 zip 下载需要认证，应用无法直接拉取，故用公开 Release 承载。
      - name: 发布 Debug APK 到 dev Release（仅 main）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHA=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
          {
            echo "# MSLX_APP-Android Actions 调试构建（不稳定）"
            echo ""
            echo "- 版本：\`$ACTIONS_VERSION\`"
            echo "- 提交：\`${GITHUB_SHA:0:7}\`"
            echo "- 分支：main"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 签名：正式签名（可覆盖安装正式版）"
            echo ""
            echo "## 校验"
            echo ""
            echo "APK 文件：\`app-debug.apk\`"
            echo "SHA-256：\`$SHA\`"
          } > dev_release_notes.md

      - name: 上传 Debug APK 到 dev Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          # name 放真实四段版本号（如 1.3.0.28），供客户端解析并做版本比较
          name: "${{ env.ACTIONS_VERSION }}"
          body_path: dev_release_notes.md
          files: app/build/outputs/apk/debug/app-debug.apk
          # v2 对已存在同名 release 自动更新；overwrite_files 覆盖同名 APK 资产；
          # make_latest=false 防止 dev 被标记为 GitHub 最新 Release（影响 About 页 latestRelease）。
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
