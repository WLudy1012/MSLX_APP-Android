name: Auto Issue Review

# 新 issue 打开时用 AI 自动打标签并评论。
#
# 实现（2026-09 调整）：直接调用 GitHub Copilot CLI（官方推荐模式，见
# docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions）。
# 此前用的 actions/ai-inference@v1 内部仍走已退役的 GitHub Models 端点
# （models.github.ai，2026-07-30 退役），任何配置组合都必然失败。
# 认证：内置 GITHUB_TOKEN + 本文件的 `copilot-requests: write` 权限（无需 PAT），
# 计费到账号 Copilot 订阅；无订阅/额度或 CLI 故障时步骤静默降级（仅 warning）。
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  # Copilot CLI 认证（GITHUB_TOKEN，无需 PAT）
  copilot-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # AI 会用 git log/blame 查历史，浅克隆只给 1 个提交不够用
          fetch-depth: 100

      # Copilot CLI 未预装在 runner 上，需自行安装（官方文档要求近期版本）。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Fetch issue title and body
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            core.setOutput('title', issue.data.title);
            core.setOutput('body', issue.data.body || '');
            core.setOutput('existing_labels', issue.data.labels.map(l => l.name).join(','));

      # 把评审指令与 issue 内容拼成提示词文件：变量经 env 传入、由 python 组装，
      # 不经过任何 YAML/shell 字符串拼接，标题/正文含方括号、换行、引号等都不受影响。
      - name: Prepare prompt
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          cat > "$RUNNER_TEMP/build_prompt.py" <<'PY'
          import os

          with open("Prompts/issue-review-instructions.txt", encoding="utf-8") as f:
              instructions = f.read()

          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          prompt = f"{instructions}\n\n---\n\nTitle: {title}\n\nBody:\n{body}\n"

          with open(os.path.join(os.environ["RUNNER_TEMP"], "ai-prompt.txt"), "w", encoding="utf-8") as f:
              f.write(prompt)
          PY
          python3 "$RUNNER_TEMP/build_prompt.py"

      - name: Run AI review
        id: ai
        # AI 不可用（无订阅/额度/网络/CLI 故障）时不让 issue 流程变红：
        # 失败仅打 warning，Parse 步骤读不到输出文件时做空值降级。
        continue-on-error: true
        # 探索式代码分析比纯文本评审慢，给足时间并留超时兑底
        timeout-minutes: 10
        env:
          # 官方支持的免 PAT 方案：GITHUB_TOKEN + 本文件的 copilot-requests 权限
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 只读授权：读文件/搜索 + 只读 git 历史查询，配合 deny 双保险禁写。
          # 其余需要权限的操作（写文件、其他 shell、网络）在 -p 模式下自动被拒。
          # 不指定 --model，用 CLI 默认模型（显式传不支持的模型名会直接失败）。
          copilot -p "$(cat "$RUNNER_TEMP/ai-prompt.txt")" -s --no-ask-user \
            --allow-tool='read,shell(git log:*),shell(git show:*),shell(git diff:*),shell(git blame:*)' \
            --deny-tool='write' \
            > "$RUNNER_TEMP/ai-response.txt" 2> "$RUNNER_TEMP/ai-stderr.log" || {
              code=$?
              echo "::warning::Copilot CLI 退出码 $code，stderr 末尾："
              tail -c 1500 "$RUNNER_TEMP/ai-stderr.log" || true
              exit $code
            }

      - name: Parse and apply AI output
        uses: actions/github-script@v7
        env:
          AI_RESPONSE_FILE: ${{ runner.temp }}/ai-response.txt
          AI_OUTCOME: ${{ steps.ai.outcome }}
          EXISTING_LABELS: ${{ steps.issue.outputs.existing_labels }}
        with:
          script: |
            const fs = require('fs');
            let raw = '';
            try {
              raw = fs.readFileSync(process.env.AI_RESPONSE_FILE, 'utf8');
            } catch (e) {
              core.debug(`AI response file not readable: ${e.message}`);
            }
            if (!raw.trim()) {
              core.warning(`AI 评审未返回内容（step outcome=${process.env.AI_OUTCOME}）。` +
                '请检查账号 Copilot 订阅/额度，以及 workflow 的 copilot-requests 权限是否生效。');
              return;
            }
            let parsed;
            try {
              const match = raw.match(/\{[\s\S]*\}/);
              parsed = JSON.parse(match ? match[0] : raw);
            } catch (e) {
              core.warning('AI response is not valid JSON, skipping label/comment.');
              return;
            }

            const allowedLabels = [
              'bug', 'enhancement', 'question', 'documentation',
              'accessibility', 'good first issue', 'help wanted',
              'duplicate', 'needs-info', 'invalid', 'wontfix',
              'priority/critical', 'priority/high', 'priority/low'
            ];

            // AI 建议与允许清单取交集：不在清单内或已存在的标签不重复应用
            const existingLabels = (process.env.EXISTING_LABELS || '')
              .split(',').map(s => s.trim()).filter(Boolean);

            const labelsToApply = (parsed.labels || [])
              .filter(l => allowedLabels.includes(l) && !existingLabels.includes(l));

            if (labelsToApply.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labelsToApply
              });
            }

            if (parsed.comment && parsed.comment.trim()) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `AI 自动评审\n\n${parsed.comment}`
              });
            }
